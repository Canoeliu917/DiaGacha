      margin: 28px auto 0; max-width: 860px;
    }
    .notes {
      display: grid; grid-template-columns: 1fr 1fr; gap: 18px 40px;
      margin-top: 36px; font-size: 20px; line-height: 1.65; color: #1c1916;
    }
    .notes b { font-weight: 500; color: #1c1916; }
    .label { font-size: 18px; fill: #8a7a62; font-family: "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; }
    .label-ink { font-size: 18px; fill: #1c1916; font-family: "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; }
    .k { font-size: 16px; fill: #c6a15a; font-family: "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; letter-spacing: 0.04em; }
    
  #stack { width:1080px; }
  .sheet + .sheet { border-top: 24px solid #e8dfd0; }
</style>
